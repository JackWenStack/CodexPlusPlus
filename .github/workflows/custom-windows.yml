name: JackWen Windows build

on:
  push:
    branches: [main, custom/windows]
  workflow_dispatch:
    inputs:
      tag:
        description: "已推送的定制标签；留空只构建，填写则创建草稿 Release"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: custom-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'JackWenStack/CodexPlusPlus'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Validate release tag
        if: inputs.tag != ''
        shell: pwsh
        env:
          CUSTOM_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content apps/codex-plus-manager/package.json -Raw | ConvertFrom-Json).version
          if ($env:CUSTOM_TAG -ne "v$version") { throw 'Tag must match the checked-out package version' }
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - name: Test, build and package
        shell: pwsh
        run: ./scripts/build-custom-windows.ps1 -Package
      - uses: actions/upload-artifact@v4
        with:
          name: custom-windows
          if-no-files-found: error
          path: |
            dist/windows/*-setup.exe
            dist/windows/*.zip
            dist/windows/latest.json
            dist/windows/SHA256SUMS.txt

  draft-release:
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: custom-windows
          path: packages
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" --json isDraft > release-state.json 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json","utf8")).isDraft) throw Error("Refusing to overwrite a published release")'
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --draft \
              --title "Codex++ JackWen ${TAG#v}" --notes-file "docs/custom-releases/$TAG.md"
          fi
          gh release upload "$TAG" packages/* --repo "$REPO" --clobber
